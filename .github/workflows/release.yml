name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          releaseDraft: true
          includeUpdaterJson: true

      - name: Generate checksums
        run: |
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [[ ! -d "$bundle_dir" ]]; then
            echo "Bundle directory not found: $bundle_dir"
            exit 1
          fi
          find "$bundle_dir" -type f \( -name "*.app.tar.gz" -o -name "*.dmg" \) -print0 | while IFS= read -r -d '' file; do
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$file" | awk '{print $1}' > "${file}.sha256"
            else
              sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            fi
          done

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
